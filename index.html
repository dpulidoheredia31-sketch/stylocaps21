<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyloCaps | Gorras</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 30px;
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url("beisbolera.jpg");
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .section {
            max-width: 1200px;
            margin: auto;
            padding: 50px 20px;
        }

        .section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filtros input,
        .filtros select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .producto {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        .producto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .producto-info {
            padding: 20px;
        }

        .producto h3 {
            margin-bottom: 10px;
        }

        .precio {
            font-size: 22px;
            font-weight: bold;
            margin: 12px 0;
        }

        .producto button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .producto button:hover {
            background: #333;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-contenido {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 15px;
            padding: 25px;
            position: relative;
        }

        .cerrar {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }

        .modal img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .campo {
            margin: 15px 0;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .cantidad {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cantidad button {
            width: 40px;
            height: 40px;
            border: none;
            background: #111;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .whatsapp {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: #25D366;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 30px;
            z-index: 150;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">StyloCaps</div>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#catalogo">Gorras</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>


<section class="hero" id="inicio">

    <div>
        <h1>StyloCaps</h1>

        <p>Gorras con estilo para todos los días.</p>

        <a href="#catalogo" class="btn">
            Ver gorras
        </a>
    </div>

</section>


<section class="section" id="catalogo">

    <h2>Nuestras gorras</h2>

    <div class="filtros">

        <input
            type="text"
            id="busqueda"
            placeholder="Buscar gorra..."
            onkeyup="mostrarProductos()"
        >

        <select id="filtroPrecio" onchange="mostrarProductos()">
            <option value="todos">Todos los precios</option>
            <option value="45000">Hasta $45.000</option>
            <option value="55000">Hasta $55.000</option>
            <option value="70000">Hasta $70.000</option>
        </select>

    </div>


    <div class="productos" id="productos"></div>

</section>


<footer id="contacto">

    <h3>StyloCaps</h3>

    <p>Gorras con estilo.</p>

    <p>WhatsApp: 300 132 3639</p>

    <br>

    <p>© 2026 StyloCaps</p>

</footer>


<a
    class="whatsapp"
    href="https://wa.me/573001323639"
    target="_blank"
>
    ☎
</a>


<div class="modal" id="modal">

    <div class="modal-contenido">

        <span class="cerrar" onclick="cerrarModal()">×</span>

        <img id="modalImagen" src="" alt="Gorra">

        <h2 id="modalNombre"></h2>

        <p id="modalDescripcion"></p>

        <p class="precio" id="modalPrecio"></p>


        <div class="campo">

            <label>Color</label>

            <select id="color">

            </select>

        </div>


        <div class="campo">

            <label>Talla</label>

            <select id="talla">

                <option>Única</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>

            </select>

        </div>


        <div class="campo">

            <label>Cantidad</label>

            <div class="cantidad">

                <button onclick="cambiarCantidad(-1)">−</button>

                <span id="cantidad">1</span>

                <button onclick="cambiarCantidad(1)">+</button>

            </div>

        </div>


        <div class="campo">

            <label>Nombre</label>

            <input
                type="text"
                id="clienteNombre"
                placeholder="Tu nombre"
            >

        </div>


        <div class="campo">

            <label>Dirección</label>

            <input
                type="text"
                id="direccion"
                placeholder="Dirección de entrega"
            >

        </div>


        <div class="campo">

            <label>Tipo de entrega</label>

            <select id="tipoEntrega">

                <option value="Domicilio">
                    Domicilio
                </option>

                <option value="Oficina">
                    Recoger en oficina
                </option>

            </select>

        </div>


        <p>
            Domicilio:
            <strong>$10.000</strong>
        </p>

        <br>


        <button
            class="btn"
            style="width:100%;"
            onclick="comprarWhatsApp()"
        >
            Comprar por WhatsApp
        </button>

    </div>

</div>


<script>

const productos = [

    {
        nombre: "Beisbolera",
        precio: 70000,
        colores: [
            "Azul",
            "Rojo",
            "Negro",
            "Amarillo"
        ],
        imagen: "beisbolera.jpg",
        descripcion:
        "Gorras cerradas con talla y buenos bordados. Calidad 1.1."
    },

    {
        nombre: "Gorra Premium",
        precio: 55000,
        colores: [
            "Negro",
            "Azul"
        ],
        imagen: "gorra2.jpg",
        descripcion:
        "Gorra moderna con excelente acabado."
    },

    {
        nombre: "Gorra Urban",
        precio: 45000,
        colores: [
            "Negro",
            "Rojo"
        ],
        imagen: "gorra3.jpg",
        descripcion:
        "Diseño urbano para combinar con cualquier estilo."
    }

];


let productoSeleccionado = null;
let cantidadActual = 1;


function mostrarProductos() {

    const contenedor =
        document.getElementById("productos");

    const busqueda =
        document
        .getElementById("busqueda")
        .value
        .toLowerCase();

    const filtro =
        document
        .getElementById("filtroPrecio")
        .value;


    contenedor.innerHTML = "";


    productos.forEach((producto, index) => {

        if (
            !producto.nombre
            .toLowerCase()
            .includes(busqueda)
        ) {
            return;
        }


        if (
            filtro !== "todos"
            &&
            producto.precio >
            Number(filtro)
        ) {
            return;
        }


        contenedor.innerHTML += `

            <div class="producto">

                <img
                    src="${producto.imagen}"
                    alt="${producto.nombre}"
                >

                <div class="producto-info">

                    <h3>
                        ${producto.nombre}
                    </h3>

                    <p>
                        ${producto.descripcion}
                    </p>

                    <div class="precio">
                        $${producto.precio.toLocaleString("es-CO")}
                    </div>

                    <button
                        onclick="abrirProducto(${index})"
                    >
                        Ver producto
                    </button>

                </div>

            </div>

        `;

    });

}


function abrirProducto(index) {

    productoSeleccionado =
        productos[index];

    cantidadActual = 1;

    document.getElementById("cantidad")
        .textContent = cantidadActual;

    document.getElementById("modalImagen")
        .src =
        productoSeleccionado.imagen;

    document.getElementById("modalNombre")
        .textContent =
        productoSeleccionado.nombre;

    document.getElementById("modalDescripcion")
        .textContent =
        productoSeleccionado.descripcion;

    document.getElementById("modalPrecio")
        .textContent =
        "$" +
        productoSeleccionado.precio
        .toLocaleString("es-CO");


    const colorSelect =
        document.getElementById("color");

    colorSelect.innerHTML = "";


    productoSeleccionado.colores
        .forEach(color => {

            colorSelect.innerHTML +=
            `<option>${color}</option>`;

        });


    document.getElementById("modal")
        .style.display = "flex";

}


function cerrarModal() {

    document.getElementById("modal")
        .style.display = "none";

}


function cambiarCantidad(valor) {

    cantidadActual += valor;

    if (cantidadActual < 1) {
        cantidadActual = 1;
    }

    document.getElementById("cantidad")
        .textContent = cantidadActual;

}


function comprarWhatsApp() {

    const nombre =
        document
        .getElementById("clienteNombre")
        .value;

    const direccion =
        document
        .getElementById("direccion")
        .value;

    const color =
        document
        .getElementById("color")
        .value;

    const talla =
        document
        .getElementById("talla")
        .value;

    const entrega =
        document
        .getElementById("tipoEntrega")
        .value;


    if (!nombre || !direccion) {

        alert(
            "Por favor completa tu nombre y dirección."
        );

        return;
    }


    const subtotal =
        productoSeleccionado.precio
        * cantidadActual;


    const domicilio =
        entrega === "Domicilio"
        ? 10000
        : 0;


    const total =
        subtotal + domicilio;


    const mensaje =

`Hola StyloCaps 👋

Quiero realizar un pedido:

🧢 Producto:
${productoSeleccionado.nombre}

🎨 Color:
${color}

📏 Talla:
${talla}

🔢 Cantidad:
${cantidadActual}

💰 Precio:
$${productoSeleccionado.precio.toLocaleString("es-CO")}

🚚 Entrega:
${entrega}

👤 Nombre:
${nombre}

📍 Dirección:
${direccion}

💵 Total:
$${total.toLocaleString("es-CO")}`;


    const numero =
        "573001323639";


    const url =
        "https://wa.me/"
        +
        numero
        +
        "?text="
        +
        encodeURIComponent(mensaje);


    window.location.href = url;

}


mostrarProductos();

</script>

</body>
</html>
