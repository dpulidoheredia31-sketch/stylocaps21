<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StyloCaps</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* =========================
   HEADER
========================= */

header{
    background:#111;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:28px;
}

.carrito-btn{
    background:white;
    color:#111;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   HERO
========================= */

.hero{
    background:#111;
    color:white;
    text-align:center;
    padding:70px 20px;
}

.hero h2{
    font-size:42px;
    margin-bottom:15px;
}

.hero p{
    color:#ccc;
    font-size:18px;
}

/* =========================
   CATALOGO
========================= */

.catalogo{
    padding:50px 7%;
}

.catalogo h2{
    text-align:center;
    margin-bottom:35px;
    font-size:30px;
}

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.producto{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.producto img{
    width:100%;
    height:280px;
    object-fit:cover;
}

.producto-info{
    padding:20px;
}

.producto-info h3{
    margin-bottom:10px;
}

.precio{
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.descripcion{
    color:#666;
    margin-bottom:15px;
    line-height:1.5;
}

.btn-producto{
    width:100%;
    padding:12px;
    background:#111;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   MODAL PRODUCTO
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:2000;
    padding:20px;
    overflow:auto;
}

.modal-contenido{
    background:white;
    max-width:500px;
    margin:50px auto;
    border-radius:15px;
    padding:25px;
    position:relative;
}

.cerrar{
    position:absolute;
    right:20px;
    top:15px;
    font-size:28px;
    cursor:pointer;
}

.modal-precio{
    font-size:22px;
    font-weight:bold;
    margin:15px 0;
}

.campo{
    margin-bottom:15px;
}

.campo label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.campo select,
.campo input{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
}

.btn-agregar{
    width:100%;
    padding:13px;
    background:#111;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   CARRITO
========================= */

.carrito{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:3000;
    padding:20px;
    overflow:auto;
}

.carrito-contenido{
    background:white;
    max-width:750px;
    margin:30px auto;
    border-radius:15px;
    padding:25px;
}

.carrito-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.cerrar-carrito{
    font-size:28px;
    cursor:pointer;
}

.item-carrito{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.item-info{
    flex:1;
}

.item-info h3{
    margin-bottom:6px;
}

.item-info p{
    color:#666;
    font-size:14px;
}

.cantidad-control{
    display:flex;
    align-items:center;
    gap:8px;
}

.cantidad-control button{
    border:none;
    background:#111;
    color:white;
    width:28px;
    height:28px;
    border-radius:5px;
    cursor:pointer;
}

.eliminar{
    background:#d00 !important;
}

/* =========================
   RESUMEN
========================= */

.resumen{
    margin-top:25px;
    border-top:2px solid #111;
    padding-top:20px;
}

.fila{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.fila.total{
    font-size:22px;
    font-weight:bold;
    border-top:1px solid #ddd;
    padding-top:15px;
}

/* =========================
   DATOS CLIENTE
========================= */

.datos-cliente{
    margin-top:30px;
}

.datos-cliente h3{
    margin-bottom:20px;
}

.datos-cliente input,
.datos-cliente select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:7px;
}

.btn-whatsapp{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   NUMERO PEDIDO
========================= */

.numero-pedido{
    background:#f1f1f1;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}

/* =========================
   WHATSAPP FLOTANTE
========================= */

.whatsapp-flotante{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#25D366;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    text-decoration:none;
    z-index:1500;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

/* =========================
   FOOTER
========================= */

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:30px 20px;
    margin-top:40px;
}

/* =========================
   MOVIL
========================= */

@media(max-width:600px){

    .hero h2{
        font-size:32px;
    }

    .hero{
        padding:50px 20px;
    }

    .catalogo{
        padding:40px 20px;
    }

    .item-carrito{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        StyloCaps
    </h1>

    <button
        class="carrito-btn"
        onclick="abrirCarrito()"
    >

        🛒 Carrito

        <span id="contadorCarrito">
            0
        </span>

    </button>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h2>
        STYLOCAPS
    </h2>

    <p>
        Gorras con estilo para todos los días.
    </p>

</section>


<!-- =========================
     CATALOGO
========================= -->

<section class="catalogo">

    <h2>
        Nuestras Gorras
    </h2>

    <div
        class="productos"
        id="listaProductos"
    ></div>

</section>


<!-- =========================
     MODAL PRODUCTO
========================= -->

<div
    class="modal"
    id="modalProducto"
>

    <div class="modal-contenido">

        <span
            class="cerrar"
            onclick="cerrarModal()"
        >
            ×
        </span>


        <h2 id="modalNombre"></h2>


        <p
            class="modal-precio"
            id="modalPrecio"
        ></p>


        <p
            id="modalDescripcion"
        ></p>


        <div class="campo">

            <label>
                Color
            </label>

            <select
                id="modalColor"
            ></select>

        </div>


        <div class="campo">

            <label>
                Talla
            </label>

            <select
                id="modalTalla"
            >

                <option value="Única">
                    Única
                </option>

                <option value="S">
                    S
                </option>

                <option value="M">
                    M
                </option>

                <option value="L">
                    L
                </option>

                <option value="XL">
                    XL
                </option>

            </select>

        </div>


        <div class="campo">

            <label>
                Cantidad
            </label>

            <input
                type="number"
                id="modalCantidad"
                value="1"
                min="1"
            >

        </div>


        <button
            class="btn-agregar"
            onclick="agregarAlCarrito()"
        >

            🛒 Agregar al carrito

        </button>

    </div>

</div>


<!-- =========================
     CARRITO
========================= -->

<div
    class="carrito"
    id="modalCarrito"
>

    <div class="carrito-contenido">

        <div class="carrito-header">

            <h2>
                🛒 Tu carrito
            </h2>

            <span
                class="cerrar-carrito"
                onclick="cerrarCarrito()"
            >
                ×
            </span>

        </div>


        <div
            class="numero-pedido"
            id="numeroPedido"
        >
            📦 Pedido #0001
        </div>


        <div
            id="listaCarrito"
        ></div>


        <!-- RESUMEN -->

        <div class="resumen">

            <div class="fila">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    $0
                </strong>

            </div>


            <div class="fila">

                <span>
                    Envío
                </span>

                <strong id="envio">
                    $0
                </strong>

            </div>


            <div class="fila total">

                <span>
                    Total
                </span>

                <strong id="total">
                    $0
                </strong>

            </div>

        </div>


        <!-- DATOS DEL CLIENTE -->

        <div class="datos-cliente">

            <h3>
                👤 Datos del cliente
            </h3>


            <input
                type="text"
                id="clienteNombre"
                placeholder="Nombre completo"
            >


            <input
                type="text"
                id="clienteCC"
                placeholder="Número de CC"
            >


            <input
                type="tel"
                id="clienteTelefono"
                placeholder="Número de teléfono"
            >


            <select
                id="ciudad"
                onchange="cargarLocalidades()"
            >

                <option value="">
                    Selecciona tu ciudad
                </option>

                <option value="Bogotá">
                    Bogotá
                </option>

                <option value="Soacha">
                    Soacha
                </option>

                <option value="Mosquera">
                    Mosquera
                </option>

            </select>


            <select
                id="localidad"
                onchange="calcularEnvio()"
            >

                <option value="">
                    Selecciona localidad
                </option>

            </select>


            <input
                type="text"
                id="direccion"
                placeholder="Dirección de entrega"
            >


            <button
                class="btn-whatsapp"
                onclick="comprarWhatsApp()"
            >

                📲 Enviar pedido por WhatsApp

            </button>

        </div>

    </div>

</div>


<!-- =========================
     WHATSAPP FLOTANTE
========================= -->

<a
    class="whatsapp-flotante"
    href="https://wa.me/573001323639"
    target="_blank"
>
    📱
</a>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 StyloCaps
    </p>

    <p>
        Gorras con estilo
    </p>

</footer>


<script>


/* =========================
   PRODUCTOS
========================= */

const productos = [

    {
        nombre:"Beisbolera",

        precio:70000,

        colores:[
            "Azul",
            "Rojo",
            "Negro",
            "Amarillo"
        ],

        imagen:"beisbolera.jpg",

        descripcion:
        "Gorras cerradas con talla y buenos bordados. Calidad 1.1."
    },


    {
        nombre:"Gorra Premium",

        precio:55000,

        colores:[
            "Negro",
            "Azul"
        ],

        imagen:"gorra2.jpg",

        descripcion:
        "Gorra moderna con excelente acabado."
    },


    {
        nombre:"Gorra Urban",

        precio:45000,

        colores:[
            "Negro",
            "Rojo"
        ],

        imagen:"gorra3.jpg",

        descripcion:
        "Diseño urbano para combinar con cualquier estilo."
    }

];


/* =========================
   ENVÍOS
========================= */

const ubicaciones = {

    "Bogotá":{

        "Kennedy":8000,

        "Bosa":8000,

        "Suba":10000,

        "Usaquén":12000

    },

    "Soacha":{

        "Todas":12000

    },

    "Mosquera":{

        "Todas":15000

    }

};


/* =========================
   VARIABLES
========================= */

let carrito = [];

let productoSeleccionado = null;

let precioEnvioActual = 0;


/* =========================
   NUMERO DE PEDIDO
========================= */

let numeroPedidoActual =

parseInt(
    localStorage.getItem(
        "stylocaps_numero_pedido"
    )
) || 1;


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(){

    const lista =
        document.getElementById(
            "listaProductos"
        );


    lista.innerHTML = "";


    productos.forEach(
        (producto,index)=>{

            lista.innerHTML += `

                <div class="producto">

                    <img
                        src="${producto.imagen}"
                        alt="${producto.nombre}"
                    >

                    <div class="producto-info">

                        <h3>
                            ${producto.nombre}
                        </h3>

                        <p class="precio">

                            $${producto.precio.toLocaleString("es-CO")}

                        </p>

                        <p class="descripcion">

                            ${producto.descripcion}

                        </p>

                        <button
                            class="btn-producto"
                            onclick="abrirProducto(${index})"
                        >

                            Ver producto

                        </button>

                    </div>

                </div>

            `;

        }
    );

}


/* =========================
   ABRIR PRODUCTO
========================= */

function abrirProducto(index){

    productoSeleccionado =
        productos[index];


    document.getElementById(
        "modalNombre"
    ).textContent =
        productoSeleccionado.nombre;


    document.getElementById(
        "modalPrecio"
    ).textContent =
        "$" +
        productoSeleccionado.precio
        .toLocaleString("es-CO");


    document.getElementById(
        "modalDescripcion"
    ).textContent =
        productoSeleccionado.descripcion;


    const color =
        document.getElementById(
            "modalColor"
        );


    color.innerHTML = "";


    productoSeleccionado.colores
    .forEach(c=>{

        color.innerHTML += `

            <option value="${c}">
                ${c}
            </option>

        `;

    });


    document.getElementById(
        "modalCantidad"
    ).value = 1;


    document.getElementById(
        "modalProducto"
    ).style.display =
        "block";

}


/* =========================
   CERRAR MODAL
========================= */

function cerrarModal(){

    document.getElementById(
        "modalProducto"
    ).style.display =
        "none";

}


/* =========================
   AGREGAR AL CARRITO
========================= */

function agregarAlCarrito(){

    const color =
        document.getElementById(
            "modalColor"
        ).value;


    const talla =
        document.getElementById(
            "modalTalla"
        ).value;


    const cantidad =
        parseInt(
            document.getElementById(
                "modalCantidad"
            ).value
        );


    if(cantidad < 1){

        alert(
            "La cantidad debe ser mayor a 0."
        );

        return;

    }


    carrito.push({

        nombre:
            productoSeleccionado.nombre,

        precio:
            productoSeleccionado.precio,

        color:
            color,

        talla:
            talla,

        cantidad:
            cantidad

    });


    cerrarModal();

    actualizarCarrito();

    alert(
        "🛒 Producto agregado al carrito."
    );

}


/* =========================
   ACTUALIZAR CARRITO
========================= */

function actualizarCarrito(){

    const lista =
        document.getElementById(
            "listaCarrito"
        );


    lista.innerHTML = "";


    let subtotal = 0;

    let cantidadTotal = 0;


    carrito.forEach(
        (item,index)=>{

            const totalProducto =
                item.precio *
                item.cantidad;


            subtotal +=
                totalProducto;


            cantidadTotal +=
                item.cantidad;


            lista.innerHTML += `

                <div class="item-carrito">

                    <div class="item-info">

                        <h3>
                            ${item.nombre}
                        </h3>

                        <p>
                            ${item.color}
                            |
                            ${item.talla}
                        </p>

                        <p>
                            $${item.precio.toLocaleString("es-CO")}
                            cada uno
                        </p>

                    </div>


                    <div class="cantidad-control">

                        <button
                            onclick="cambiarCantidad(${index},-1)"
                        >
                            -
                        </button>


                        <strong>
                            ${item.cantidad}
                        </strong>


                        <button
                            onclick="cambiarCantidad(${index},1)"
                        >
                            +
                        </button>


                        <button
                            class="eliminar"
                            onclick="eliminarProducto(${index})"
                        >
                            ×
                        </button>

                    </div>

                </div>

            `;

        }
    );


    document.getElementById(
        "contadorCarrito"
    ).textContent =
        cantidadTotal;


    document.getElementById(
        "subtotal"
    ).textContent =
        "$" +
        subtotal.toLocaleString("es-CO");


    document.getElementById(
        "envio"
    ).textContent =

        precioEnvioActual === 0

        ? "$0"

        :

        "$" +
        precioEnvioActual
        .toLocaleString("es-CO");


    const total =
        subtotal +
        precioEnvioActual;


    document.getElementById(
        "total"
    ).textContent =
        "$" +
        total.toLocaleString("es-CO");


    mostrarNumeroPedido();

}


/* =========================
   CAMBIAR CANTIDAD
========================= */

function cambiarCantidad(
    index,
    cambio
){

    carrito[index].cantidad +=
        cambio;


    if(
        carrito[index].cantidad <= 0
    ){

        carrito.splice(
            index,
            1
        );

    }


    actualizarCarrito();

}


/* =========================
   ELIMINAR PRODUCTO
========================= */

function eliminarProducto(index){

    carrito.splice(
        index,
        1
    );


    actualizarCarrito();

}


/* =========================
   ABRIR CARRITO
========================= */

function abrirCarrito(){

    document.getElementById(
        "modalCarrito"
    ).style.display =
        "block";


    actualizarCarrito();

}


/* =========================
   CERRAR CARRITO
========================= */

function cerrarCarrito(){

    document.getElementById(
        "modalCarrito"
    ).style.display =
        "none";

}


/* =========================
   MOSTRAR NUMERO PEDIDO
========================= */

function mostrarNumeroPedido(){

    const numero =
        String(
            numeroPedidoActual
        ).padStart(4,"0");


    document.getElementById(
        "numeroPedido"
    ).textContent =
        "📦 Pedido #" +
        numero;

}


/* =========================
   CARGAR LOCALIDADES
========================= */

function cargarLocalidades(){

    const ciudad =
        document.getElementById(
            "ciudad"
        ).value;


    const localidad =
        document.getElementById(
            "localidad"
        );


    localidad.innerHTML = `

        <option value="">
            Selecciona localidad
        </option>

    `;


    precioEnvioActual = 0;


    if(!ciudad){

        actualizarCarrito();

        return;

    }


    const opciones =
        ubicaciones[ciudad];


    Object.keys(opciones)
    .forEach(nombre=>{

        localidad.innerHTML += `

            <option value="${nombre}">
                ${nombre}
            </option>

        `;

    });


    actualizarCarrito();

}


/* =========================
   CALCULAR ENVÍO
========================= */

function calcularEnvio(){

    const ciudad =
        document.getElementById(
            "ciudad"
        ).value;


    const localidad =
        document.getElementById(
            "localidad"
        ).value;


    if(
        !ciudad ||
        !localidad
    ){

        precioEnvioActual = 0;

        actualizarCarrito();

        return;

    }


    precioEnvioActual =
        ubicaciones[ciudad][localidad];


    actualizarCarrito();

}


/* =========================
   COMPRAR POR WHATSAPP
========================= */

function comprarWhatsApp(){

    if(carrito.length === 0){

        alert(
            "🛒 Tu carrito está vacío."
        );

        return;

    }


    const nombre =
        document.getElementById(
            "clienteNombre"
        ).value.trim();


    const cc =
        document.getElementById(
            "clienteCC"
        ).value.trim();


    const telefono =
        document.getElementById(
            "clienteTelefono"
        ).value.trim();


    const ciudad =
        document.getElementById(
            "ciudad"
        ).value;


    const localidad =
        document.getElementById(
            "localidad"
        ).value;


    const direccion =
        document.getElementById(
            "direccion"
        ).value.trim();


    /* =========================
       VALIDACIONES
    ========================= */

    if(!nombre){

        alert(
            "Escribe tu nombre."
        );

        return;

    }


    if(!cc){

        alert(
            "Escribe tu CC."
        );

        return;

    }


    if(!telefono){

        alert(
            "Escribe tu teléfono."
        );

        return;

    }


    if(!ciudad){

        alert(
            "Selecciona una ciudad."
        );

        return;

    }


    if(!localidad){

        alert(
            "Selecciona una localidad."
        );

        return;

    }


    if(!direccion){

        alert(
            "Escribe tu dirección."
        );

        return;

    }


    if(precioEnvioActual === 0){

        alert(
            "No se pudo calcular el envío."
        );

        return;

    }


    /* =========================
       NUMERO PEDIDO
    ========================= */

    const numeroPedido =
        String(
            numeroPedidoActual
        ).padStart(4,"0");


    /* =========================
       MENSAJE WHATSAPP
    ========================= */

    let mensaje =
`Hola StyloCaps 👋

📦 Pedido #${numeroPedido}

🛍️ Productos:
`;


    let subtotal = 0;


    carrito.forEach(
        item=>{

            const totalProducto =
                item.precio *
                item.cantidad;


            subtotal +=
                totalProducto;


            mensaje += `

🧢 ${item.nombre}
${item.color} | ${item.talla} | x${item.cantidad}
$${totalProducto.toLocaleString("es-CO")}
`;

        }
    );


    /* =========================
       TOTAL
    ========================= */

    const total =
        subtotal +
        precioEnvioActual;


    /* =========================
       DATOS Y VALORES SEPARADOS
    ========================= */

    mensaje += `

👤 Datos:
${nombre}
CC: ${cc}
📱 ${telefono}
📍 ${ciudad} - ${localidad}
🏠 ${direccion}

🧢 Valor gorras: $${subtotal.toLocaleString("es-CO")}
🚚 Domicilio: $${precioEnvioActual.toLocaleString("es-CO")}
💰 Total a pagar: $${total.toLocaleString("es-CO")}
`;


    /* =========================
       GUARDAR SIGUIENTE PEDIDO
    ========================= */

    numeroPedidoActual++;


    localStorage.setItem(
        "stylocaps_numero_pedido",
        numeroPedidoActual
    );


    /* =========================
       WHATSAPP
    ========================= */

    const numero =
        "573001323639";


    const url =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(
            mensaje
        );


    window.location.href =
        url;

}


/* =========================
   INICIAR PAGINA
========================= */

mostrarProductos();

mostrarNumeroPedido();


</script>


</body>

</html>
