<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StyloCaps | Gorras</title>


<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    color:#222;
}


/* =========================
   HEADER
========================= */

header{
    background:#111;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.carrito{
    cursor:pointer;
    font-size:18px;
}

#contadorCarrito{
    background:#fff;
    color:#111;
    border-radius:50%;
    padding:4px 8px;
    font-size:13px;
    margin-left:5px;
}


/* =========================
   HERO
========================= */

.hero{
    background:#111;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:42px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
}


/* =========================
   CATALOGO
========================= */

.catalogo{
    max-width:1200px;
    margin:40px auto;
    padding:20px;
}

.catalogo h2{
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}


/* =========================
   PRODUCTO
========================= */

.producto{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.10);
    transition:0.3s;
}

.producto:hover{
    transform:translateY(-5px);
}

.producto img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.producto-contenido{
    padding:20px;
}

.producto h3{
    margin-bottom:10px;
    font-size:22px;
}

.precio{
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.descripcion{
    color:#666;
    margin-bottom:15px;
}

.btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#111;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#333;
}


/* =========================
   MODAL PRODUCTO
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:2000;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-contenido{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:15px;
    padding:25px;
}

.cerrar{
    float:right;
    font-size:25px;
    cursor:pointer;
}

.modal-contenido h2{
    margin-bottom:20px;
}

.campo{
    margin-bottom:15px;
}

.campo label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.campo select,
.campo input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}


/* =========================
   CARRITO
========================= */

.carrito-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:2500;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.carrito-contenido{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:15px;
    padding:25px;
}

.item-carrito{
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.item-carrito h4{
    margin-bottom:8px;
}

.item-carrito p{
    margin:5px 0;
}

.btn-eliminar{
    background:#d00;
    color:white;
    border:none;
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-top:5px;
}


/* =========================
   RESUMEN
========================= */

.resumen{
    margin-top:20px;
    padding:20px;
    background:#f5f5f5;
    border-radius:10px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.resumen-total{
    font-size:20px;
    font-weight:bold;
    border-top:1px solid #ccc;
    padding-top:12px;
}


/* =========================
   BOTON WHATSAPP
========================= */

.whatsapp-flotante{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    text-decoration:none;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
    z-index:3000;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:50px;
}


/* =========================
   MOVIL
========================= */

@media(max-width:600px){

    .hero h1{
        font-size:32px;
    }

    .producto img{
        height:280px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        StyloCaps
    </div>

    <div
        class="carrito"
        onclick="abrirCarrito()"
    >

        🛒 Carrito

        <span id="contadorCarrito">
            0
        </span>

    </div>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        StyloCaps
    </h1>

    <p>
        Gorras con estilo para todos los días
    </p>

</section>



<!-- =========================
     CATALOGO
========================= -->

<section class="catalogo">

    <h2>
        Nuestra colección
    </h2>


    <div
        class="productos"
        id="productos"
    ></div>

</section>



<!-- =========================
     MODAL PRODUCTO
========================= -->

<div
    class="modal"
    id="modalProducto"
>

    <div class="modal-contenido">

        <span
            class="cerrar"
            onclick="cerrarProducto()"
        >
            ×
        </span>


        <h2 id="modalNombre">
            Producto
        </h2>


        <div class="campo">

            <label>
                Color
            </label>

            <select id="modalColor">
            </select>

        </div>


        <div class="campo">

            <label>
                Talla
            </label>

            <select id="modalTalla">

                <option value="">
                    Seleccionar talla
                </option>

                <option value="S">
                    S
                </option>

                <option value="M">
                    M
                </option>

                <option value="L">
                    L
                </option>

                <option value="XL">
                    XL
                </option>

            </select>

        </div>


        <div class="campo">

            <label>
                Cantidad
            </label>

            <input
                type="number"
                id="modalCantidad"
                value="1"
                min="1"
            >

        </div>


        <button
            class="btn"
            onclick="agregarAlCarrito()"
        >

            🛒 Agregar al carrito

        </button>

    </div>

</div>



<!-- =========================
     CARRITO
========================= -->

<div
    class="carrito-modal"
    id="modalCarrito"
>

    <div class="carrito-contenido">

        <span
            class="cerrar"
            onclick="cerrarCarrito()"
        >
            ×
        </span>


        <h2>
            🛒 Tu carrito
        </h2>


        <div id="listaCarrito">
        </div>


        <div class="resumen">

            <div class="resumen-linea">

                <span>
                    🧢 Valor gorras:
                </span>

                <strong id="subtotal">
                    $0
                </strong>

            </div>


            <div class="resumen-linea">

                <span>
                    🚚 Domicilio:
                </span>

                <strong id="envio">
                    $0
                </strong>

            </div>


            <div class="resumen-linea resumen-total">

                <span>
                    💰 Total a pagar:
                </span>

                <strong id="total">
                    $0
                </strong>

            </div>

        </div>



        <!-- =========================
             DATOS CLIENTE
        ========================= -->

        <h3 style="margin-top:25px;">
            👤 Datos del cliente
        </h3>


        <div class="campo">

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="clienteNombre"
                placeholder="Tu nombre"
            >

        </div>


        <div class="campo">

            <label>
                CC
            </label>

            <input
                type="text"
                id="clienteCC"
                placeholder="Número de cédula"
            >

        </div>


        <div class="campo">

            <label>
                Teléfono
            </label>

            <input
                type="text"
                id="clienteTelefono"
                placeholder="Número de teléfono"
            >

        </div>


        <div class="campo">

            <label>
                Ciudad
            </label>

            <select
                id="ciudad"
                onchange="cargarLocalidades()"
            >

                <option value="">
                    Seleccionar ciudad
                </option>

                <option value="Bogotá">
                    Bogotá
                </option>

                <option value="Soacha">
                    Soacha
                </option>

                <option value="Mosquera">
                    Mosquera
                </option>

            </select>

        </div>


        <div class="campo">

            <label>
                Localidad
            </label>

            <select
                id="localidad"
                onchange="calcularEnvio()"
            >

                <option value="">
                    Seleccionar localidad
                </option>

            </select>

        </div>


        <div class="campo">

            <label>
                Dirección
            </label>

            <input
                type="text"
                id="direccion"
                placeholder="Ej: CLLE 41 86G 05"
            >

        </div>


        <div class="campo">

            <label>
                Número de pedido
            </label>

            <input
                type="text"
                id="numeroPedido"
                value="0001"
                readonly
            >

        </div>


        <button
            class="btn"
            onclick="comprarWhatsApp()"
        >

            📲 Comprar por WhatsApp

        </button>

    </div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 StyloCaps
    </p>

    <p style="margin-top:8px;">
        Gorras con estilo
    </p>

</footer>



<!-- =========================
     WHATSAPP FLOTANTE
========================= -->

<a
    class="whatsapp-flotante"
    href="https://wa.me/573001323639"
    target="_blank"
>

    💬

</a>



<script>


/* ==================================================
   PRODUCTOS
================================================== */


const productos = [

    {
        nombre:"Beisbolera",
        precio:70000,
        colores:[
            "Azul",
            "Rojo",
            "Negro",
            "Amarillo"
        ],
        imagen:"beisbolera.jpg",
        descripcion:
        "Gorras cerradas con talla y buenos bordados. Calidad 1.1."
    },


    {
        nombre:"Gorra Premium",
        precio:55000,
        colores:[
            "Negro",
            "Azul"
        ],
        imagen:"gorra2.jpg",
        descripcion:
        "Gorra moderna con excelente acabado."
    },


    {
        nombre:"Gorra Urban",
        precio:45000,
        colores:[
            "Negro",
            "Rojo"
        ],
        imagen:"gorra3.jpg",
        descripcion:
        "Diseño urbano para combinar con cualquier estilo."
    }

];



/* ==================================================
   UBICACIONES Y ENVÍOS
================================================== */


const ubicaciones = {

    "Bogotá":{

        "Kennedy":8000,

        "Bosa":8000,

        "Suba":10000,

        "Usaquén":12000

    },

    "Soacha":{

        "Todas":12000

    },

    "Mosquera":{

        "Todas":15000

    }

};



/* ==================================================
   VARIABLES
================================================== */


let carrito = [];

let productoSeleccionado = null;

let precioEnvioActual = 0;


/* ==================================================
   NUMERO DE PEDIDO
================================================== */


let numeroPedidoActual =
    parseInt(
        localStorage.getItem(
            "stylocaps_numero_pedido"
        )
    ) || 1;



/* ==================================================
   MOSTRAR PRODUCTOS
================================================== */


function mostrarProductos(){

    const contenedor =
        document.getElementById("productos");


    contenedor.innerHTML = "";


    productos.forEach(
        (producto,index) => {

            contenedor.innerHTML += `

                <div class="producto">

                    <img
                        src="${producto.imagen}"
                        alt="${producto.nombre}"
                    >

                    <div class="producto-contenido">

                        <h3>
                            ${producto.nombre}
                        </h3>

                        <div class="precio">
                            $${producto.precio.toLocaleString("es-CO")}
                        </div>

                        <div class="descripcion">
                            ${producto.descripcion}
                        </div>

                        <button
                            class="btn"
                            onclick="abrirProducto(${index})"
                        >
                            Comprar
                        </button>

                    </div>

                </div>

            `;

        }
    );

}



/* ==================================================
   ABRIR PRODUCTO
================================================== */


function abrirProducto(index){

    productoSeleccionado =
        productos[index];


    document.getElementById(
        "modalNombre"
    ).innerText =
        productoSeleccionado.nombre;


    const selectColor =
        document.getElementById(
            "modalColor"
        );


    selectColor.innerHTML = "";


    productoSeleccionado.colores.forEach(
        color => {

            selectColor.innerHTML += `

                <option value="${color}">
                    ${color}
                </option>

            `;

        }
    );


    document.getElementById(
        "modalCantidad"
    ).value = 1;


    document.getElementById(
        "modalTalla"
    ).value = "";


    document.getElementById(
        "modalProducto"
    ).style.display = "flex";

}



/* ==================================================
   CERRAR PRODUCTO
================================================== */


function cerrarProducto(){

    document.getElementById(
        "modalProducto"
    ).style.display = "none";

}



/* ==================================================
   AGREGAR AL CARRITO
================================================== */


function agregarAlCarrito(){

    if(!productoSeleccionado){
        return;
    }


    const color =
        document.getElementById(
            "modalColor"
        ).value;


    const talla =
        document.getElementById(
            "modalTalla"
        ).value;


    const cantidad =
        parseInt(
            document.getElementById(
                "modalCantidad"
            ).value
        );


    if(!talla){

        alert(
            "Selecciona una talla."
        );

        return;

    }


    if(cantidad < 1){

        alert(
            "La cantidad debe ser mínimo 1."
        );

        return;

    }


    carrito.push({

        nombre:
            productoSeleccionado.nombre,

        precio:
            productoSeleccionado.precio,

        color:
            color,

        talla:
            talla,

        cantidad:
            cantidad

    });


    actualizarCarrito();

    cerrarProducto();


    alert(
        "🛒 Producto agregado al carrito."
    );

}



/* ==================================================
   ACTUALIZAR CARRITO
================================================== */


function actualizarCarrito(){

    const lista =
        document.getElementById(
            "listaCarrito"
        );


    lista.innerHTML = "";


    let subtotal = 0;


    carrito.forEach(
        (item,index) => {

            const totalProducto =
                item.precio *
                item.cantidad;


            subtotal +=
                totalProducto;


            lista.innerHTML += `

                <div class="item-carrito">

                    <h4>
                        🧢 ${item.nombre}
                    </h4>

                    <p>
                        Color: ${item.color}
                    </p>

                    <p>
                        Talla: ${item.talla}
                    </p>

                    <p>
                        Cantidad: ${item.cantidad}
                    </p>

                    <p>
                        Valor:
                        $${totalProducto.toLocaleString("es-CO")}
                    </p>

                    <button
                        class="btn-eliminar"
                        onclick="eliminarProducto(${index})"
                    >
                        Eliminar
                    </button>

                </div>

            `;

        }
    );


    document.getElementById(
        "contadorCarrito"
    ).innerText =
        carrito.reduce(
            (total,item) =>
                total + item.cantidad,
            0
        );


    document.getElementById(
        "subtotal"
    ).innerText =
        "$" +
        subtotal.toLocaleString("es-CO");


    document.getElementById(
        "envio"
    ).innerText =
        "$" +
        precioEnvioActual.toLocaleString("es-CO");


    const total =
        subtotal +
        precioEnvioActual;


    document.getElementById(
        "total"
    ).innerText =
        "$" +
        total.toLocaleString("es-CO");

}



/* ==================================================
   ELIMINAR PRODUCTO
================================================== */


function eliminarProducto(index){

    carrito.splice(
        index,
        1
    );


    actualizarCarrito();

}



/* ==================================================
   ABRIR CARRITO
================================================== */


function abrirCarrito(){

    actualizarCarrito();


    document.getElementById(
        "numeroPedido"
    ).value =
        String(
            numeroPedidoActual
        ).padStart(
            4,
            "0"
        );


    document.getElementById(
        "modalCarrito"
    ).style.display =
        "flex";

}



/* ==================================================
   CERRAR CARRITO
================================================== */


function cerrarCarrito(){

    document.getElementById(
        "modalCarrito"
    ).style.display =
        "none";

}



/* ==================================================
   CARGAR LOCALIDADES
================================================== */


function cargarLocalidades(){

    const ciudad =
        document.getElementById(
            "ciudad"
        ).value;


    const localidad =
        document.getElementById(
            "localidad"
        );


    localidad.innerHTML = `

        <option value="">
            Seleccionar localidad
        </option>

    `;


    precioEnvioActual = 0;


    if(
        ciudad &&
        ubicaciones[ciudad]
    ){

        Object.keys(
            ubicaciones[ciudad]
        ).forEach(
            nombre => {

                localidad.innerHTML += `

                    <option value="${nombre}">
                        ${nombre}
                    </option>

                `;

            }
        );

    }


    actualizarCarrito();

}



/* ==================================================
   CALCULAR ENVÍO
================================================== */


function calcularEnvio(){

    const ciudad =
        document.getElementById(
            "ciudad"
        ).value;


    const localidad =
        document.getElementById(
            "localidad"
        ).value;


    if(
        ciudad &&
        localidad &&
        ubicaciones[ciudad] &&
        ubicaciones[ciudad][localidad]
    ){

        precioEnvioActual =
            ubicaciones[ciudad][localidad];

    }else{

        precioEnvioActual = 0;

    }


    actualizarCarrito();

}

   COMPRAR POR WHATSAPP
================================================== */
